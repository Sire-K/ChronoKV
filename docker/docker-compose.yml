services:
  chronokv:
    build:
      context: ..
      dockerfile: crates/kv-net/Dockerfile
    ports:
      - "6379:6379"
    volumes:
      - chronokv_data:/data
    restart: unless-stopped

  semantic-cache:
    build:
      context: ../semantic-cache
      dockerfile: Dockerfile
    environment:
      CHRONOKV_HOST: chronokv
      CHRONOKV_PORT: "6379"
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      SIMILARITY_THRESHOLD: "0.78"
    ports:
      - "8000:8000"
    depends_on:
      - chronokv
    gpus: all
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chronokv
      POSTGRES_PASSWORD: chronokv
      POSTGRES_DB: chronokv
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  chronokv_data:
  pgvector_data:
